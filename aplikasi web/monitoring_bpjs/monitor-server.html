<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .alert-banner {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #dc2626;
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out, pulse 1s infinite;
            font-weight: bold;
            font-size: 16px;
        }

        .alert-banner.show {
            display: flex;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 1;
        }

        .close-btn:hover {
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .server-list {
            margin-top: 20px;
        }

        .server-item {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-item-info {
            flex: 1;
        }

        .server-item-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .server-item-url {
            color: #94a3b8;
            font-size: 13px;
            word-break: break-all;
        }

        .server-item-actions {
            display: flex;
            gap: 10px;
        }

        .header {
            background: #1e293b;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        .btn-success {
            background: #22c55e;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn-warning {
            background: #f59e0b;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-danger {
            background: #ef4444;
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-edit {
            background: #3b82f6;
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #2563eb;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #334155;
            padding: 20px;
            border-radius: 10px;
        }

        .stat-card.online { background: #14532d; }
        .stat-card.offline { background: #7f1d1d; }

        .stat-label {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
        }

        .settings-section {
            background: #334155;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #93c5fd;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        select {
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .chart-container {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .chart-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #93c5fd;
        }

        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .server-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-left: 4px solid #eab308;
        }

        .server-card.online {
            border-left-color: #22c55e;
        }

        .server-card.offline {
            border-left-color: #ef4444;
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .server-info h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .server-url {
            color: #94a3b8;
            font-size: 13px;
            word-break: break-all;
        }

        .status-icon {
            width: 32px;
            height: 32px;
        }

        .status-icon.checking {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .server-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: #94a3b8;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge.online {
            background: #14532d;
            color: #86efac;
        }

        .status-badge.offline {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .status-badge.checking {
            background: #713f12;
            color: #fde047;
        }

        .activity-log {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .log-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .log-content {
            background: #0f172a;
            border-radius: 8px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-content::-webkit-scrollbar {
            width: 8px;
        }

        .log-content::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }

        .log-content::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .log-entry {
            color: #cbd5e1;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            margin-bottom: 10px;
            padding: 8px;
            background: #1e293b;
            border-radius: 4px;
        }

        .log-entry.telegram {
            border-left: 3px solid #0088cc;
        }

        .log-entry.whatsapp {
            border-left: 3px solid #25D366;
        }

        .log-empty {
            color: #64748b;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .server-grid {
                grid-template-columns: 1fr;
            }
            
            .header-top {
                flex-direction: column;
                align-items: stretch;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="alertBanner" class="alert-banner">
        <span style="font-size: 24px;">⚠️</span>
        <span id="alertMessage"></span>
    </div>

    <!-- Modal Manage Servers -->
    <div id="serverModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">⚙️ Manage Servers</h2>
                <button class="close-btn" onclick="closeServerModal()">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">Server Name</label>
                <input type="text" id="serverName" class="form-input" placeholder="e.g., Web Server 1">
            </div>

            <div class="form-group">
                <label class="form-label">Server URL</label>
                <input type="text" id="serverUrl" class="form-input" placeholder="https://example.com">
            </div>

            <input type="hidden" id="editServerId" value="">

            <button class="btn btn-success" onclick="saveServer()" id="saveServerBtn" style="width: 100%; justify-content: center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Add Server
            </button>

            <div class="server-list">
                <h3 style="margin-bottom: 15px; color: #93c5fd;">Current Servers</h3>
                <div id="serverListContent"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="header-title">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                    </svg>
                    <h1>Server Monitoring Dashboard</h1>
                </div>
                <div class="btn-group">
                    <button class="btn btn-warning" onclick="openServerModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                        Manage Servers
                    </button>
                    <button class="btn" onclick="checkAllServers()" id="refreshBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <polyline points="1 20 1 14 7 14"></polyline>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        Refresh
                    </button>
                    <button class="btn btn-success" onclick="exportLogsToCSV()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Export CSV
                    </button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Servers</div>
                    <div class="stat-value" id="totalServers">0</div>
                </div>
                <div class="stat-card online">
                    <div class="stat-label" style="color: #86efac;">Online</div>
                    <div class="stat-value" id="onlineServers">0</div>
                </div>
                <div class="stat-card offline">
                    <div class="stat-label" style="color: #fca5a5;">Offline</div>
                    <div class="stat-value" id="offlineServers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Uptime</div>
                    <div class="stat-value" id="uptimePercent">0%</div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-title">⚙️ Settings</div>
                <div class="settings-grid">
                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoRefreshCheck" checked onchange="toggleAutoRefresh()">
                            <span>Auto Refresh</span>
                        </label>
                        <select id="refreshInterval" onchange="updateRefreshInterval()">
                            <option value="10">10 detik</option>
                            <option value="30" selected>30 detik</option>
                            <option value="60">1 menit</option>
                            <option value="300">5 menit</option>
                        </select>
                    </div>

                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="soundAlarmCheck" checked onchange="toggleSoundAlarm()">
                            <span>🔔 Sound Alarm</span>
                        </label>
                        <button onclick="testAlarm()" class="btn btn-small">
                            Test Alarm
                        </button>
                    </div>

                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="telegramCheck" onchange="toggleTelegram()">
                            <span>📱 Telegram</span>
                        </label>
                        <small style="color: #94a3b8;">Configure telegram-notify.php</small>
                    </div>

                    <div class="setting-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="whatsappCheck" onchange="toggleWhatsApp()">
                            <span>💬 WhatsApp</span>
                        </label>
                        <small style="color: #94a3b8;">Configure whatsapp-notify.php</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-title">📊 List Server</div>
            <canvas id="uptimeChart" height="0"></canvas>
        </div>

        <div id="serverGrid" class="server-grid"></div>

        <div class="activity-log">
            <div class="log-header">
                <div class="log-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Activity Log
                </div>
                <button onclick="clearLogs()" class="btn btn-small">
                    Clear Log
                </button>
            </div>
            <div class="log-content" id="logContent">
                <div class="log-empty">No activity yet...</div>
            </div>
        </div>
    </div>

    <script>
        let servers = [];
        let logs = [];
        let autoRefresh = true;
        let refreshIntervalId = null;
        let refreshInterval = 30;
        let isChecking = false;
        let soundAlarmEnabled = true;
        let telegramEnabled = false;
        let whatsappEnabled = false;
        let audioContext = null;
        let uptimeChart = false;
        let nextServerId = 1;

        function loadServers() {
            const saved = localStorage.getItem('monitorServers');
            if (saved) {
                try {
                    servers = JSON.parse(saved);
                    nextServerId = Math.max(...servers.map(s => s.id), 0) + 1;
                } catch (e) {
                    servers = [];
                    nextServerId = 1;
                }
            }
        }

        function saveServers() {
            localStorage.setItem('monitorServers', JSON.stringify(servers));
        }

        function openServerModal() {
            document.getElementById('serverModal').classList.add('show');
            document.getElementById('editServerId').value = '';
            document.getElementById('serverName').value = '';
            document.getElementById('serverUrl').value = '';
            document.getElementById('saveServerBtn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Add Server';
            updateServerList();
        }

        function closeServerModal() {
            document.getElementById('serverModal').classList.remove('show');
        }

        function editServer(id) {
            const server = servers.find(s => s.id === id);
            if (!server) return;

            document.getElementById('editServerId').value = server.id;
            document.getElementById('serverName').value = server.name;
            document.getElementById('serverUrl').value = server.url;
            document.getElementById('saveServerBtn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Update Server';
            
            document.getElementById('serverName').focus();
        }

        function saveServer() {
            const name = document.getElementById('serverName').value.trim();
            const url = document.getElementById('serverUrl').value.trim();
            const editId = document.getElementById('editServerId').value;

            if (!name || !url) {
                alert('Please fill in both server name and URL!');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                alert('URL must start with http:// or https://');
                return;
            }

            if (editId) {
                // Update existing server
                const index = servers.findIndex(s => s.id == editId);
                if (index !== -1) {
                    servers[index].name = name;
                    servers[index].url = url;
                    addLog(`✏️ Server updated: ${name}`);
                }
            } else {
                // Add new server
                const newServer = {
                    id: nextServerId++,
                    name: name,
                    url: url,
                    status: 'checking',
                    responseTime: 0,
                    lastCheck: null
                };
                servers.push(newServer);
                addLog(`✅ Server added: ${name}`);
            }

            saveServers();
            
            document.getElementById('serverName').value = '';
            document.getElementById('serverUrl').value = '';
            document.getElementById('editServerId').value = '';
            document.getElementById('saveServerBtn').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Add Server';
            
            updateServerList();
            updateUI();
            reinitChart();
        }

        function deleteServer(id) {
            const server = servers.find(s => s.id === id);
            if (!server) return;

            if (confirm(`Delete server "${server.name}"?`)) {
                servers = servers.filter(s => s.id !== id);
                saveServers();
                addLog(`🗑️ Server deleted: ${server.name}`);
                updateServerList();
                updateUI();
                reinitChart();
            }
        }

        function updateServerList() {
            const container = document.getElementById('serverListContent');
            if (servers.length === 0) {
                container.innerHTML = '<div class="log-empty">No servers yet. Add one above!</div>';
                return;
            }

            container.innerHTML = servers.map(server => `
                <div class="server-item">
                    <div class="server-item-info">
                        <div class="server-item-name">${server.name}</div>
                        <div class="server-item-url">${server.url}</div>
                    </div>
                    <div class="server-item-actions">
                        <button class="btn btn-edit" onclick="editServer(${server.id})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteServer(${server.id})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function initChart() {
            const ctx = document.getElementById('uptimeChart').getContext('30d');
            
            if (uptimeChart) {
                uptimeChart.destroy();
            }

            uptimeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: servers.map((server, index) => ({
                        label: server.name,
                        data: [],
                        borderColor: getChartColor(index),
                        backgroundColor: getChartColor(index, 0.1),
                        tension: 0.4,
                        fill: true
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#cbd5e1'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 1,
                            ticks: {
                                color: '#94a3b8',
                                stepSize: 1,
                                callback: function(value) {
                                    return value === 1 ? 'Online' : 'Offline';
                                }
                            },
                            grid: {
                                color: '#334155'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#94a3b8',
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: {
                                color: '#334155'
                            }
                        }
                    }
                }
            });
        }

        function reinitChart() {
            initChart();
        }

        function getChartColor(index, alpha = 1) {
            const colors = [
                `rgba(59, 130, 246, ${alpha})`,
                `rgba(34, 197, 94, ${alpha})`,
                `rgba(234, 179, 8, ${alpha})`,
                `rgba(239, 68, 68, ${alpha})`,
                `rgba(168, 85, 247, ${alpha})`,
                `rgba(236, 72, 153, ${alpha})`,
                `rgba(20, 184, 166, ${alpha})`,
                `rgba(251, 146, 60, ${alpha})`
            ];
            return colors[index % colors.length];
        }

        function updateChart() {
            if (!uptimeChart || servers.length === 0) return;
            
            const now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            
            uptimeChart.data.labels.push(now);
            if (uptimeChart.data.labels.length > 20) {
                uptimeChart.data.labels.shift();
            }
            
            servers.forEach((server, index) => {
                if (uptimeChart.data.datasets[index]) {
                    const value = server.status === 'online' ? 1 : 0;
                    uptimeChart.data.datasets[index].data.push(value);
                    if (uptimeChart.data.datasets[index].data.length > 20) {
                        uptimeChart.data.datasets[index].data.shift();
                    }
                }
            });
            
            uptimeChart.update('none');
        }

        function exportLogsToCSV() {
            if (logs.length === 0) {
                alert('No logs to export!');
                return;
            }
            
            let csv = 'Timestamp,Event\n';
            logs.forEach(log => {
                const cleanLog = log.replace(/"/g, '""');
                csv += `"${cleanLog}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `server-monitor-log-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            
            addLog(`📥 Log exported to CSV (${logs.length} entries)`);
        }

        function clearLogs() {
            if (confirm('Are you sure you want to clear all logs?')) {
                logs = [];
                updateLogs();
                localStorage.removeItem('serverMonitorLogs');
                addLog('🗑️ Logs cleared');
            }
        }

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playAlarmSound() {
            if (!soundAlarmEnabled) return;
            
            initAudio();
            
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                }, i * 600);
            }
        }

        function testAlarm() {
            playAlarmSound();
            showAlert('Testing alarm sound! 🔔');
        }

        function toggleSoundAlarm() {
            soundAlarmEnabled = document.getElementById('soundAlarmCheck').checked;
            localStorage.setItem('soundAlarmEnabled', soundAlarmEnabled);
        }

        function toggleTelegram() {
            telegramEnabled = document.getElementById('telegramCheck').checked;
            localStorage.setItem('telegramEnabled', telegramEnabled);
        }

        function toggleWhatsApp() {
            whatsappEnabled = document.getElementById('whatsappCheck').checked;
            localStorage.setItem('whatsappEnabled', whatsappEnabled);
        }

        async function sendTelegramNotification(serverName, status, message) {
            if (!telegramEnabled) return;
            
            try {
                const response = await fetch('telegram-notify.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        serverName: serverName,
                        status: status,
                        message: message
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    addLog(`📱 Telegram sent: ${serverName}`, 'telegram');
                }
            } catch (error) {
                console.error('Telegram error:', error);
            }
        }

        async function sendWhatsAppNotification(serverName, status, message) {
            if (!whatsappEnabled) return;
            
            try {
                const response = await fetch('whatsapp-notify.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        serverName: serverName,
                        status: status,
                        message: message
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    addLog(`💬 WhatsApp sent: ${serverName}`, 'whatsapp');
                }
            } catch (error) {
                console.error('WhatsApp error:', error);
            }
        }

        async function checkServer(server) {
            try {
                const response = await fetch(`check-server.php?url=${encodeURIComponent(server.url)}`);
                const data = await response.json();
                
                return {
                    status: data.status === 'online' ? 'online' : 'offline',
                    responseTime: data.responseTime || 0
                };
            } catch (error) {
                return { status: 'offline', responseTime: 0 };
            }
        }

        async function checkAllServers() {
            if (isChecking) return;
            if (servers.length === 0) {
                alert('No servers to monitor! Please add servers first.');
                return;
            }
            
            isChecking = true;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Checking...';

            if (logs.length === 0) {
                addLog(`🚀 Monitoring started at ${new Date().toLocaleString('id-ID')}`);
            }

            for (let i = 0; i < servers.length; i++) {
                const server = servers[i];
                const oldStatus = server.status;
                const result = await checkServer(server);
                const now = new Date().toLocaleString('id-ID');
                
                if (oldStatus === 'online' && result.status === 'offline') {
                    const message = `⚠️ ${server.name} is DOWN!`;
                    addLog(`${now} - ${message}`);
                    showAlert(message);
                    playAlarmSound();
                    
                    await sendTelegramNotification(server.name, 'down', `Server ${server.name} is not responding!`);
                    await sendWhatsAppNotification(server.name, 'down', `Server ${server.name} is not responding!`);
                }
                
                if (oldStatus === 'offline' && result.status === 'online') {
                    const message = `✅ ${server.name} RECOVERED`;
                    addLog(`${now} - ${message}`);
                    
                    await sendTelegramNotification(server.name, 'up', `Server ${server.name} is back online!`);
                    await sendWhatsAppNotification(server.name, 'up', `Server ${server.name} is back online!`);
                }
                
                if (oldStatus === 'checking') {
                    const statusText = result.status === 'online' ? '✅ Online' : '❌ Offline';
                    addLog(`${now} - ${server.name}: ${statusText} (${result.responseTime}ms)`);
                }
                
                servers[i].status = result.status;
                servers[i].responseTime = result.responseTime;
                servers[i].lastCheck = now;
                
                updateUI();
            }
            
            updateChart();
            
            isChecking = false;
            btn.disabled = false;
            btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> Refresh';
        }

        function showAlert(message) {
            const banner = document.getElementById('alertBanner');
            const messageEl = document.getElementById('alertMessage');
            messageEl.textContent = message;
            banner.classList.add('show');
            
            setTimeout(() => {
                banner.classList.remove('show');
            }, 5000);
        }

        function addLog(message, type = null) {
            logs.unshift(message);
            if (logs.length > 100) logs.pop();
            updateLogs();
            saveLogsToStorage();
        }

        function updateLogs() {
            const logContent = document.getElementById('logContent');
            if (logs.length === 0) {
                logContent.innerHTML = '<div class="log-empty">No activity yet...</div>';
            } else {
                logContent.innerHTML = logs.map(log => {
                    const isTelegram = log.includes('📱 Telegram');
                    const isWhatsApp = log.includes('💬 WhatsApp');
                    const className = isTelegram ? 'telegram' : isWhatsApp ? 'whatsapp' : '';
                    return `<div class="log-entry ${className}">${log}</div>`;
                }).join('');
            }
        }

        function saveLogsToStorage() {
            try {
                localStorage.setItem('serverMonitorLogs', JSON.stringify(logs.slice(0, 100)));
            } catch (e) {
                console.error('Failed to save logs:', e);
            }
        }

        function loadLogsFromStorage() {
            try {
                const saved = localStorage.getItem('serverMonitorLogs');
                if (saved) {
                    logs = JSON.parse(saved);
                    updateLogs();
                }
            } catch (e) {
                console.error('Failed to load logs:', e);
            }
        }

        function updateUI() {
            updateStats();
            updateServerCards();
        }

        function updateStats() {
            const total = servers.length;
            const online = servers.filter(s => s.status === 'online').length;
            const offline = servers.filter(s => s.status === 'offline').length;
            const uptime = total > 0 ? Math.round((online / total) * 100) : 0;
            
            document.getElementById('totalServers').textContent = total;
            document.getElementById('onlineServers').textContent = online;
            document.getElementById('offlineServers').textContent = offline;
            document.getElementById('uptimePercent').textContent = uptime + '%';
        }

        function updateServerCards() {
            const grid = document.getElementById('serverGrid');
            if (servers.length === 0) {
                grid.innerHTML = '<div class="log-empty" style="grid-column: 1/-1;">No servers to monitor. Click "Manage Servers" to add servers.</div>';
                return;
            }
            
            grid.innerHTML = servers.map(server => `
                <div class="server-card ${server.status}">
                    <div class="server-header">
                        <div class="server-info">
                            <h3>${server.name}</h3>
                            <div class="server-url">${server.url}</div>
                        </div>
                        <div class="status-icon ${server.status}">
                            ${getStatusIcon(server.status)}
                        </div>
                    </div>
                    <div class="server-details">
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="status-badge ${server.status}">${server.status.toUpperCase()}</span>
                        </div>
                        ${server.status === 'online' ? `
                            <div class="detail-row">
                                <span class="detail-label">Response Time:</span>
                                <span style="font-weight: bold;">${server.responseTime}ms</span>
                            </div>
                        ` : ''}
                        ${server.lastCheck ? `
                            <div class="detail-row">
                                <span class="detail-label">Last Check:</span>
                                <span style="font-size: 13px;">${server.lastCheck}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getStatusIcon(status) {
            if (status === 'online') {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
            } else if (status === 'offline') {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
            } else {
                return '<svg viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>';
            }
        }

        function toggleAutoRefresh() {
            autoRefresh = document.getElementById('autoRefreshCheck').checked;
            localStorage.setItem('autoRefresh', autoRefresh);
            if (autoRefresh) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function updateRefreshInterval() {
            refreshInterval = parseInt(document.getElementById('refreshInterval').value);
            localStorage.setItem('refreshInterval', refreshInterval);
            if (autoRefresh) {
                stopAutoRefresh();
                startAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshIntervalId = setInterval(checkAllServers, refreshInterval * 1000);
        }

        function stopAutoRefresh() {
            if (refreshIntervalId) {
                clearInterval(refreshIntervalId);
                refreshIntervalId = null;
            }
        }

        function loadSettings() {
            const savedAutoRefresh = localStorage.getItem('autoRefresh');
            const savedInterval = localStorage.getItem('refreshInterval');
            const savedSoundAlarm = localStorage.getItem('soundAlarmEnabled');
            const savedTelegram = localStorage.getItem('telegramEnabled');
            const savedWhatsApp = localStorage.getItem('whatsappEnabled');
            
            if (savedAutoRefresh !== null) {
                autoRefresh = savedAutoRefresh === 'true';
                document.getElementById('autoRefreshCheck').checked = autoRefresh;
            }
            
            if (savedInterval !== null) {
                refreshInterval = parseInt(savedInterval);
                document.getElementById('refreshInterval').value = refreshInterval;
            }
            
            if (savedSoundAlarm !== null) {
                soundAlarmEnabled = savedSoundAlarm === 'true';
                document.getElementById('soundAlarmCheck').checked = soundAlarmEnabled;
            }
            
            if (savedTelegram !== null) {
                telegramEnabled = savedTelegram === 'true';
                document.getElementById('telegramCheck').checked = telegramEnabled;
            }
            
            if (savedWhatsApp !== null) {
                whatsappEnabled = savedWhatsApp === 'true';
                document.getElementById('whatsappCheck').checked = whatsappEnabled;
            }
        }

        window.onload = function() {
            loadServers();
            loadSettings();
            loadLogsFromStorage();
            initChart();
            updateUI();
            
            if (servers.length > 0) {
                checkAllServers();
                if (autoRefresh) {
                    startAutoRefresh();
                }
            }
        };

        window.onclick = function(event) {
            const modal = document.getElementById('serverModal');
            if (event.target === modal) {
                closeServerModal();
            }
        }
    </script>
</body>
</html>
