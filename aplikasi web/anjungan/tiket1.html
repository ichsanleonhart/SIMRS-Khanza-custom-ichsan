<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Pasien</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Custom CSS -->
    <style>
        .navbar {
            background-color: #007bff;
        }

        .navbar h3 {
            color: #fff;
        }

        .card h1,
        .card h3 {
            color: #007bff;
        }

        .footer {
            background-color: #17a2b8;
            color: #fff;
            padding: 10px 0;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <h3><i class="fas fa-hospital-symbol"></i> RS Demo</h3>
            <div class="ms-auto">
                <h3><i class="fas fa-clock"></i> <span id="clock">--:--:--</span></h3>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-4">
        <div class="row">
            <!-- Video Section -->
            <div class="col-md-8 mb-4">
                <div class="card">
                    <video id="myVideo" class="w-100" autoplay muted loop>
                        <source src="video.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <!-- Buttons Section -->
            <div class="col-md-4">
                <div class="d-flex flex-column gap-3">
                    <!-- Nomor Antrian -->
                    <div class="card border-primary text-center p-3">
                        <h3>Nomor Antrian</h3>
                        <h1 id="nomorAntrian">A001</h1>
                        <h5 id="waktuAntrian">--:--:--</h5>
                    </div>

                    <!-- Tombol Cetak -->
                    <button class="btn btn-danger w-100 p-3" onclick="cetakAntrian('BPJS')">
                        <h4>Cetak Antrian BPJS</h4>
                    </button>
                    <button class="btn btn-warning w-100 p-3" onclick="cetakAntrian('Non BPJS')">
                        <h4>Cetak Antrian Non BPJS</h4>
                    </button>
                    <button class="btn btn-success w-100 p-3" onclick="cetakAntrian('IGD')">
                        <h4>Cetak Antrian IGD</h4>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center mt-4">
        <p>&copy; 2025 RS Demo. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        let bpjsCounter = 1;
        let nonBpjsCounter = 1;
        let igdCounter = 1;

        // Update clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString();
            document.getElementById('waktuAntrian').textContent = now.toLocaleTimeString();
        }, 1000);

        // Cetak Antrian
        function cetakAntrian(type) {
            const nomorAntrianEl = document.getElementById('nomorAntrian');
            if (type === 'BPJS') {
                nomorAntrianEl.textContent = `B${String(bpjsCounter).padStart(3, '0')}`;
                bpjsCounter++;
            } else if (type === 'Non BPJS') {
                nomorAntrianEl.textContent = `N${String(nonBpjsCounter).padStart(3, '0')}`;
                nonBpjsCounter++;
            } else if (type === 'IGD') {
                nomorAntrianEl.textContent = `I${String(igdCounter).padStart(3, '0')}`;
                igdCounter++;
            }
            alert(`Nomor Antrian ${type}: ${nomorAntrianEl.textContent}`);
        }
    </script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
